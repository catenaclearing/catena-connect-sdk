name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm tsc
      - run: pnpm test
      - run: pnpm build
      # Static analysis run on an installed package reads the built bundle in
      # `node_modules`, not our source, so the bundle is what gets scanned.
      # `--no-git-ignore` because `dist/` is gitignored, and the root
      # `.semgrepignore` replaces Semgrep's default, which skips `dist/` too;
      # without both it scans nothing and passes. Hence the check after it
      # that every bundle was actually read.
      - name: Semgrep (built bundles)
        run: |
          pipx run --spec semgrep==1.180.0 semgrep scan \
            --config p/javascript --config p/nodejsscan \
            --metrics=off --error --no-git-ignore \
            --json-output=semgrep.json packages/*/dist
          for bundle in packages/*/dist/*.js packages/*/dist/*.cjs; do
            jq -e --arg f "$bundle" '.paths.scanned | index($f)' semgrep.json > /dev/null \
              || { echo "::error::Semgrep did not scan $bundle"; exit 1; }
          done

  # The iframe check's timing in real browsers (`e2e/`). jsdom loads no frames
  # and has no network, so this is the only place a slow network is tested.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:e2e
