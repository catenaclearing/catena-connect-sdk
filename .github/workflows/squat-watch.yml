name: Typosquat watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Scan npm for new "catena" packages
        id: scan
        run: |
          set +e
          OUTPUT=$(node scripts/squat-watch.mjs)
          STATUS=$?
          echo "$OUTPUT"
          {
            echo "names<<NAMES_EOF"
            echo "$OUTPUT"
            echo "NAMES_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -eq 2 ]; then
            exit 2
          fi
          if [ "$STATUS" -eq 1 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure security label exists
        if: steps.scan.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create security \
            --description "Supply-chain / typosquat findings" \
            --color D93F0B || true
      - name: Open or update tracking issue
        if: steps.scan.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAMES: ${{ steps.scan.outputs.names }}
        run: |
          TITLE="Typosquat watch: new 'catena' packages on npm"
          BODY=$(printf 'The daily npm scan found packages not on the allowlist:\n\n```\n%s\n```\n\nTriage: if unrelated, add the name to scripts/squat-allowlist.json; if a squat, file an npm abuse report (https://docs.npmjs.com/reporting-malware-in-an-npm-package).' "$NAMES")
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label security
          fi
